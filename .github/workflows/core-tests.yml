name: core tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The plugin needs the ATAK SDK from tak.gov (not redistributable), so CI covers the core only.
      - run: chmod +x gradlew && ./gradlew -p core test --console=plain
